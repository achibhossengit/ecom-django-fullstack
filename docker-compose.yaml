services:
  ecom-postgres:
    image: postgres:17
    container_name: ecom-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecom-db
    ports:
      - '5432:5432'
    volumes:
      - ecom-post-data:/var/lib/postgresql/data

volumes:
  ecom-post-data:
